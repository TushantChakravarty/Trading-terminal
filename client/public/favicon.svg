<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#1e2332" stroke-width="0.75"/>

  <!-- Subtle baseline -->
  <line x1="2" y1="22" x2="30" y2="22" stroke="#1e2332" stroke-width="0.6"/>

  <!-- Candle 1 — Bearish (red) -->
  <line x1="7.5" y1="5"  x2="7.5" y2="27" stroke="#ff3d57" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="4.5" y="9"  width="6" height="12" rx="1" fill="#ff3d57"/>

  <!-- Candle 2 — Small bullish (green, reversal) -->
  <line x1="16"  y1="11" x2="16"  y2="26" stroke="#00e676" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="13"  y="15" width="6" height="6"  rx="1" fill="#00e676"/>

  <!-- Candle 3 — Strong bullish (green, breakout) with glow -->
  <line x1="24.5" y1="3"  x2="24.5" y2="22" stroke="#00e676" stroke-width="1.2" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="21.5" y="6"  width="6" height="13" rx="1" fill="#00e676" filter="url(#glow)"/>
</svg>
